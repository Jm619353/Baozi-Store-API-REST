# Identificacao do Projeto
spring.application.name=api

# CONFIGURACOES DE CONEXAO COM O BANCO DE DADOS (MySQL)

# String de conexao JDBC. 
# baozidb: nome do Schema no MySQL.
# useSSL=false: Desativa conexoes seguras para ambiente de desenvolvimento local.
# serverTimezone=UTC: Garante a sincronia de horarios entre a aplicacao banco.
spring.datasource.url=${DB_URL}

# Credenciais de acesso ao servico de banco de dados
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ESTRATEGIA DE PERSISTENCIA E ORM (HIBERNATE)


# DDL-AUTO: Define como o Hibernate deve gerenciar o esquema do banco.
# 'update': Altera o banco de dados para refletir mudancas nas classes @Entity 
# sem apagar os dados existentes. Ideal para fase de desenvolvimento.
spring.jpa.hibernate.ddl-auto=update

# LOGGING E DEBUG:
# Habilita a exibicao dos comandos SQL gerados pelo Hibernate no console.
spring.jpa.show-sql=true

# Formata o SQL exibido para facilitar a leitura e depuracao (Debug).
spring.jpa.properties.hibernate.format_sql=true